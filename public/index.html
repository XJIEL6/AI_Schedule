<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1号会员店发版日历</title>
<style>
/* ===== CSS Custom Properties ===== */
:root {
  /* ── Color System ── */
  --color-primary: #2563EB;
  --color-primary-hover: #1D4ED8;
  --color-primary-light: #EFF6FF;
  --color-primary-border: #BFDBFE;
  --color-warning: #F59E0B;
  --color-warning-light: #FFFBEB;
  --color-warning-border: #FDE68A;
  --color-success: #10B981;
  --color-success-light: #ECFDF5;
  --color-success-border: #A7F3D0;
  --color-danger: #EF4444;
  --color-danger-light: #FEF2F2;
  --color-danger-border: #FECACA;

  /* Neutral palette (Slate) */
  --color-bg: #F8FAFC;
  --color-surface: #FFFFFF;
  --color-surface-alt: #F1F5F9;
  --color-surface-hover: #E2E8F0;
  --color-border-light: #E2E8F0;
  --color-border: #CBD5E1;
  --color-border-strong: #94A3B8;
  --color-text-disabled: #94A3B8;
  --color-text-secondary: #64748B;
  --color-text-body: #475569;
  --color-text-primary: #1E293B;
  --color-text-heading: #0F172A;

  /* ── Semantic Preserved Colors ── */
  --ev-brd-init-bg: #DBEAFE;   --ev-brd-init-text: #1D4ED8;
  --ev-brd-final-bg: #EDE9FE;  --ev-brd-final-text: #6D28D9;
  --ev-prd-init-bg: #D1FAE5;   --ev-prd-init-text: #065F46;
  --ev-prd-final-bg: #BBF7D0;  --ev-prd-final-text: #047857;
  --ev-prd-order-bg: #FEF3C7;  --ev-prd-order-text: #92400E;
  --ev-prd-search-bg: #FDE68A; --ev-prd-search-text: #78350F;
  --ev-schedule-bg: #DBEAFE;   --ev-schedule-text: #1E40AF;
  --ev-dev-bg: #E0F2FE;        --ev-dev-text: #0369A1;
  --ev-test-bg: #FCE7F3;       --ev-test-text: #9D174D;
  --ev-regression-bg: #FEE2E2; --ev-regression-text: #991B1B;
  --ev-gray-bg: #F3F4F6;       --ev-gray-text: #374151;
  --ev-android-bg: #DCFCE7;    --ev-android-text: #166534;
  --ev-launch-bg: #6EE7B7;     --ev-launch-text: #064E3B;

  /* ── Typography ── */
  --font-sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "SF Mono", "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace;
  --text-xs: 0.6875rem;   /* 11px */
  --text-sm: 0.75rem;     /* 12px */
  --text-base: 0.8125rem; /* 13px */
  --text-md: 0.875rem;    /* 14px */
  --text-lg: 1rem;        /* 16px */
  --text-xl: 1.125rem;    /* 18px */
  --text-2xl: 1.5rem;     /* 24px */
  --leading-tight: 1.25;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  /* ── Spacing (4px base) ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;

  /* ── Border Radius ── */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;

  /* ── Shadows ── */
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 4px 12px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-xl: 0 8px 24px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);

  /* ── Transitions ── */
  --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --duration-fast: 150ms;
  --duration-normal: 200ms;
  --duration-slow: 300ms;
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  font-family: var(--font-sans);
  background: var(--color-bg);
  color: var(--color-text-body);
  line-height: var(--leading-normal);
  min-height: 100vh;
}

/* ===== Container ===== */
.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: var(--space-6) var(--space-5);
}

/* ===== Header ===== */
.page-header {
  margin-bottom: var(--space-6);
  padding-bottom: var(--space-5);
  border-bottom: 1px solid var(--color-border-light);
}

.page-header h2 {
  font-size: var(--text-2xl);
  font-weight: 700;
  color: var(--color-text-heading);
  letter-spacing: -0.02em;
  margin-bottom: var(--space-1);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.page-header h2::before {
  content: '';
  display: inline-block;
  width: 4px;
  height: 22px;
  background: var(--color-primary);
  border-radius: var(--radius-full);
}

.page-header .subtitle {
  font-size: var(--text-base);
  color: var(--color-text-secondary);
  margin-left: calc(var(--space-2) + 4px);
}

/* ===== Main Layout ===== */
.main-layout {
  display: flex;
  gap: var(--space-6);
  align-items: flex-start;
}

.main-left {
  flex: 0 0 58%;
  min-width: 0;
}

.main-right {
  flex: 1;
  min-width: 340px;
  position: sticky;
  top: var(--space-6);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

/* ===== Month Navigation ===== */
.month-nav {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
  padding: var(--space-2) var(--space-3);
  background: var(--color-surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-light);
  box-shadow: var(--shadow-sm);
}

.month-nav button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-border-light);
  background: var(--color-surface);
  color: var(--color-text-primary);
  font-size: var(--text-md);
  cursor: pointer;
  transition: all var(--duration-fast) var(--ease-out);
  user-select: none;
}

.month-nav button:hover {
  background: var(--color-surface-alt);
  border-color: var(--color-border);
}

.month-nav button:active {
  transform: scale(0.95);
  background: var(--color-surface-hover);
}

.month-title {
  font-size: var(--text-lg);
  font-weight: 600;
  color: var(--color-text-heading);
  min-width: 120px;
  text-align: center;
}

.month-nav .nav-hint {
  font-size: var(--text-xs);
  color: var(--color-text-disabled);
  margin-left: auto;
}

/* ===== Calendar Grid ===== */
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  margin-bottom: var(--space-4);
  background: var(--color-surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-light);
  padding: var(--space-2);
  box-shadow: var(--shadow-sm);
}

.cal-header {
  text-align: center;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-text-secondary);
  padding: var(--space-2) var(--space-1);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.cal-header:nth-child(1),
.cal-header:nth-child(7) {
  color: var(--color-text-disabled);
}

.cal-day {
  min-height: 78px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  padding: 5px 6px;
  position: relative;
  background: var(--color-surface);
  transition: all var(--duration-fast) var(--ease-out);
  cursor: default;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.cal-day:hover {
  background: var(--color-primary-light);
  border-color: var(--color-primary-border);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
  z-index: 1;
}

.cal-day.other-month { background: var(--color-surface-alt); opacity: 0.45; }
.cal-day.other-month:hover { opacity: 0.6; transform: none; box-shadow: none; }
.cal-day.weekend { background: #FAFBFC; }
.cal-day.weekend:hover { background: #F1F5F9; }
.cal-day.holiday { background: #FFFBEB; border-color: #FDE68A; }
.cal-day.holiday:hover { background: #FEF3C7; border-color: #FCD34D; }
.cal-day.today {
  border: 2px solid var(--color-primary) !important;
  background: var(--color-primary-light);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.day-num {
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-text-secondary);
  margin-bottom: 3px;
  line-height: 1;
  flex-shrink: 0;
}
.day-num.holiday-num { color: #D97706; font-weight: 600; }
.day-badge { font-size: 8px; padding: 0 2px; border-radius: 2px; margin-left: 1px; }
.day-badge.hol { background: #FEE2E2; color: #EF4444; }
.day-badge.wrk { background: #D1FAE5; color: #065F46; }

/* ===== Event Tags ===== */
.event {
  font-size: 10px;
  font-weight: 500;
  padding: 1px 5px;
  border-radius: 3px;
  margin-bottom: 2px;
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.01em;
  flex-shrink: 0;
  transition: opacity var(--duration-fast) var(--ease-out);
}
.cal-day:hover .event { opacity: 0.9; }

/* Event semantic colors */
.ev-brd-init   { background: var(--ev-brd-init-bg);   color: var(--ev-brd-init-text); }
.ev-brd-final  { background: var(--ev-brd-final-bg);  color: var(--ev-brd-final-text); }
.ev-prd-init   { background: var(--ev-prd-init-bg);   color: var(--ev-prd-init-text); }
.ev-prd-final  { background: var(--ev-prd-final-bg);  color: var(--ev-prd-final-text); }
.ev-prd-order  { background: var(--ev-prd-order-bg);  color: var(--ev-prd-order-text); }
.ev-prd-search { background: var(--ev-prd-search-bg); color: var(--ev-prd-search-text); }
.ev-schedule   { background: var(--ev-schedule-bg);   color: var(--ev-schedule-text); }
.ev-dev        { background: var(--ev-dev-bg);        color: var(--ev-dev-text); }
.ev-test       { background: var(--ev-test-bg);       color: var(--ev-test-text); }
.ev-regression { background: var(--ev-regression-bg); color: var(--ev-regression-text); }
.ev-gray       { background: var(--ev-gray-bg);       color: var(--ev-gray-text); border: 0.5px solid #D1D5DB; }
.ev-android    { background: var(--ev-android-bg);    color: var(--ev-android-text); }
.ev-launch     { background: var(--ev-launch-bg);     color: var(--ev-launch-text); font-weight: 600; }

/* ===== Legend ===== */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3) var(--space-4);
  margin-bottom: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--color-surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-light);
  box-shadow: var(--shadow-sm);
}

.leg-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
  white-space: nowrap;
}

.leg-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}

/* ===== Version Tabs ===== */
/* Filter bar */
.filter-bar {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  background: var(--color-surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-light);
  box-shadow: var(--shadow-sm);
}

.version-tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: var(--space-3);
}

.version-tab {
  padding: 5px 14px;
  font-size: var(--text-sm);
  font-weight: 500;
  border-radius: var(--radius-full);
  cursor: pointer;
  user-select: none;
  border: 1px solid var(--color-border-light);
  color: var(--color-text-secondary);
  background: var(--color-surface);
  transition: all var(--duration-fast) var(--ease-out);
  box-shadow: var(--shadow-sm);
}

.version-tab:hover {
  background: var(--color-surface-alt);
  border-color: var(--color-border);
  color: var(--color-text-primary);
}

.version-tab:active {
  transform: scale(0.96);
}

.version-tab.active {
  background: var(--color-primary);
  color: #FFFFFF;
  border-color: var(--color-primary);
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
}

/* ===== Right Tabs (Holiday / Chat Switch) ===== */
.right-tabs {
  display: flex;
  gap: 0;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--color-border-light);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
}

.right-tab {
  flex: 1;
  text-align: center;
  padding: 9px 0;
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  user-select: none;
  background: var(--color-surface);
  color: var(--color-text-secondary);
  transition: all var(--duration-fast) var(--ease-out);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.right-tab:first-child {
  border-right: 1px solid var(--color-border-light);
}

.right-tab:hover:not(.active) {
  background: var(--color-surface-alt);
  color: var(--color-text-primary);
}

.right-tab.active {
  background: var(--color-primary);
  color: #FFFFFF;
  font-weight: 600;
}

/* ===== Right Panels ===== */
.right-panel {
  display: none;
  animation: fadeSlideIn var(--duration-normal) var(--ease-out);
}

.right-panel.show {
  display: block;
}

@keyframes fadeSlideIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== Cards ===== */
.card {
  background: var(--color-surface);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-light);
  padding: var(--space-4) var(--space-5);
  box-shadow: var(--shadow-sm);
}

.card h3 {
  font-size: var(--text-md);
  font-weight: 600;
  margin-bottom: var(--space-3);
  color: var(--color-text-heading);
}

/* ===== Holiday Management Panel ===== */
.holiday-panel {}
.holiday-panel h3 {
  font-size: var(--text-md);
  font-weight: 600;
  margin-bottom: var(--space-3);
  color: var(--color-text-heading);
}

/* ── Management Section ── */
.mgmt-section {
  margin-bottom: var(--space-3);
}
.mgmt-section:last-child { margin-bottom: 0; }

.mgmt-label {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: var(--space-2);
}

.mgmt-row {
  display: flex;
  gap: var(--space-2);
  align-items: center;
  flex-wrap: wrap;
}

.mgmt-row input[type="date"] {
  padding: 6px 10px;
  font-size: var(--text-sm);
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text-primary);
  font-family: var(--font-sans);
  transition: border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
}

.mgmt-row input[type="date"]:focus {
  outline: none;
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.mgmt-row .date-sep {
  font-size: var(--text-xs);
  color: var(--color-text-disabled);
  flex-shrink: 0;
}

.btn {
  padding: 6px 12px;
  font-size: var(--text-sm);
  font-weight: 500;
  border-radius: var(--radius-sm);
  cursor: pointer;
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  color: var(--color-text-primary);
  font-family: var(--font-sans);
  transition: all var(--duration-fast) var(--ease-out);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.btn:hover {
  background: var(--color-surface-alt);
  border-color: var(--color-border-strong);
}

.btn:active {
  transform: scale(0.96);
}

.btn-primary {
  background: var(--color-primary);
  color: #FFFFFF;
  border-color: var(--color-primary);
  font-weight: 500;
}

.btn-primary:hover {
  background: var(--color-primary-hover);
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
}

.btn-danger {
  background: var(--color-danger-light);
  color: #991B1B;
  border-color: var(--color-danger-border);
}

.btn-danger:hover {
  background: #FEE2E2;
}

.btn-warn {
  background: var(--color-warning-light);
  color: #92400E;
  border-color: var(--color-warning-border);
}

.btn-warn:hover {
  background: #FEF3C7;
}

.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--color-text-disabled);
  padding: 3px 8px;
  font-size: 11px;
}

.btn-ghost:hover {
  background: var(--color-danger-light);
  color: var(--color-danger);
  border-color: var(--color-danger-border);
}

/* ── Rule Display Section ── */
.rules-section {
  margin-top: var(--space-4);
  padding-top: var(--space-3);
  border-top: 1px solid var(--color-border-light);
}

.rules-section-header {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: var(--space-2);
}

.rule-group {
  margin-bottom: var(--space-3);
}

.rule-group:last-child { margin-bottom: 0; }

.rule-group-title {
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-text-disabled);
  margin-bottom: var(--space-1);
  padding-left: 2px;
}

.rule-list {
  display: flex;
  flex-direction: column;
  gap: 3px;
  max-height: 140px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--color-border) transparent;
}

.rule-list::-webkit-scrollbar { width: 5px; }
.rule-list::-webkit-scrollbar-track { background: transparent; }
.rule-list::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: var(--radius-full); }

.rule-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  background: var(--color-surface);
  border: 1px solid var(--color-border-light);
  transition: background var(--duration-fast) var(--ease-out);
}

.rule-item:hover {
  background: var(--color-surface-alt);
}

.rule-item.holiday { border-left: 3px solid var(--color-danger); }
.rule-item.makeup { border-left: 3px solid var(--color-success); }
.rule-item.norelease { border-left: 3px solid #6B7280; }

.rule-item-body {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
}

.rule-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: var(--radius-full);
  flex-shrink: 0;
  line-height: 1.6;
}

.rule-badge.holiday { background: var(--color-danger-light); color: #991B1B; }
.rule-badge.makeup  { background: var(--color-success-light); color: #065F46; }
.rule-badge.norelease { background: #F3F4F6; color: #374151; }

.rule-item-text {
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rule-empty {
  font-size: var(--text-sm);
  color: var(--color-text-disabled);
  padding: var(--space-3);
  text-align: center;
}

/* ===== Chat Panel ===== */
.chat-panel {
  display: flex;
  flex-direction: column;
  min-height: 320px;
}

.chat-container {
  display: flex;
  flex: 1;
  gap: var(--space-2);
  min-height: 0;
}

.conversations-sidebar {
  width: 200px;
  border-right: 1px solid var(--color-border-light);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.conversations-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--space-2) var(--space-2);
  border-bottom: 1px solid var(--color-border-light);
}

.conversations-header h4 {

<script>
/* ================================================================
 *  All JavaScript logic preserved exactly from the original.
 *  Only CSS/HTML structure has been redesigned.
 * ================================================================ */
const YEAR = 2026;

// China public holidays 2026
const holidays = new Set([
  '2026-01-01','2026-01-02','2026-01-03',
  '2026-01-28','2026-01-29','2026-01-30','2026-01-31',
  '2026-02-01','2026-02-02','2026-02-03','2026-02-04',
  '2026-04-06','2026-04-05',
  '2026-05-01','2026-05-02','2026-05-03','2026-05-04','2026-05-05',
  '2026-06-19','2026-06-20','2026-06-21',
  '2026-09-25',
  '2026-10-01','2026-10-02','2026-10-03','2026-10-04','2026-10-05','2026-10-06','2026-10-07',
]);

const makeupDays = new Set([
  '2026-01-25','2026-02-08',
  '2026-04-26',
  '2026-09-20',
  '2026-05-10',
  '2026-10-10',
]);

function isWeekend(d) {
  const day = d.getDay();
  return day === 0 || day === 6;
}

let userHolidays = [];
let userMakeupDays = [];
let noReleaseRanges = [];

function expandRange(range) {
  const out = new Set();
  const s = new Date(range.start + 'T00:00:00');
  const e = new Date(range.end + 'T00:00:00');
  const cur = new Date(s);
  while (cur <= e) {
    out.add(fmt(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}

function isHoliday(d) {
  const key = fmt(d);
  if (holidays.has(key)) return true;
  for (const r of userHolidays) {
    if (expandRange(r).has(key)) return true;
  }
  return false;
}

function isMakeup(d) {
  const key = fmt(d);
  if (makeupDays.has(key)) return true;
  for (const r of userMakeupDays) {
    if (expandRange(r).has(key)) return true;
  }
  return false;
}

function isNoReleaseDate(d) {
  const key = fmt(d);
  for (const r of noReleaseRanges) {
    if (expandRange(r).has(key)) return true;
  }
  return false;
}

function isWorkday(d) {
  if (isHoliday(d)) return false;
  if (isMakeup(d)) return true;
  if (isWeekend(d)) return false;
  return true;
}

function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

function fmt(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function addWorkdays(d, n) {
  if (n >= 0) {
    let cur = new Date(d);
    let count = 0;
    while (count < n) {
      cur = addDays(cur, 1);
      if (isWorkday(cur)) count++;
    }
    return cur;
  } else {
    let cur = new Date(d);
    let count = 0;
    const target = -n;
    while (count < target) {
      cur = addDays(cur, -1);
      if (isWorkday(cur)) count++;
    }
    return cur;
  }
}

function nextWorkday(d) {
  return addWorkdays(d, 1);
}

function ensureWorkday(d) {
  let cur = new Date(d);
  while (!isWorkday(cur)) cur = addDays(cur, 1);
  return cur;
}

function countWorkdays(start, end) {
  let count = 0;
  let cur = new Date(start);
  while (cur <= end) {
    if (isWorkday(cur)) count++;
    cur = addDays(cur, 1);
  }
  return count;
}

function fmtCN(d) {
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

function hasLongHoliday(start, end) {
  let cur = new Date(start);
  let streak = 0;
  let maxStreak = 0;
  while (cur <= end) {
    if (!isWorkday(cur)) {
      streak++;
      maxStreak = Math.max(maxStreak, streak);
    } else {
      streak = 0;
    }
    cur = addDays(cur, 1);
  }
  return maxStreak >= 4;
}

// ===== 版本自动生成 — BRD 每两周周四，先定发版日再倒推 =====
let startBrdDate = '2026-06-04';
const SINGLE_VERSION_MONTHS = new Set([0, 1, 4, 5, 9, 10]); // 8(Sep)改为双版
function nextMonday(d) { let cur = new Date(d); while (cur.getDay() !== 1) cur = addDays(cur, 1); return cur; }
function nextBRDThursday(prev) { let d = addDays(prev, 14); while (d.getDay() !== 4) d = addDays(d, 1); return d; }

// 找到目标发版日
function findTargetLaunch(m, type) {
  const yr = 2026;
  if (type === 'end') {
    let d = new Date(yr, m + 1, 0);
    while (!isWorkday(d) || isNoReleaseDate(d)) d = addDays(d, -1);
    return d;
  } else {
    let d = new Date(yr, m, 15);
    let fwd = new Date(d), bwd = new Date(d); while (fwd.getDay() !== 2) fwd = addDays(fwd, 1); while (bwd.getDay() !== 2) bwd = addDays(bwd, -1); d = (d - bwd < fwd - d) ? bwd : fwd; // 最接近15号的周二
    if (isNoReleaseDate(d)) d = addDays(d, 7);
    return d;
  }
}

function buildOneVersion(brdDateStr, targetLaunch) {
  let brdInit = new Date(brdDateStr + 'T00:00:00');
  if (!isWorkday(brdInit)) brdInit = ensureWorkday(brdInit);

  const brdFinal      = addWorkdays(brdInit, 3);   // 隔2个工作日→周二
  const prdInitInt    = addWorkdays(brdFinal, 2);  // 隔1个工作日→周四
  const prdFinalOrder = nextMonday(prdInitInt);    // 下一个周一
  const prdFinalSearch = addWorkdays(prdFinalOrder, 1);
  const prdFinalInt   = new Date(prdFinalSearch);
  const schedule      = addWorkdays(prdFinalSearch, 2);
  const devStart      = addWorkdays(schedule, 1);

  // 从目标发版日倒推
  let launch = targetLaunch;
  const huaweiIosReview = new Date(launch);
  const androidReview   = addWorkdays(huaweiIosReview, -1);
  // 灰度 & 回归倒推
  const grayEnd   = addDays(androidReview, -1);
  let grayStart = addDays(grayEnd, -1);
  let day3 = addDays(grayEnd, 1);
  while (!isWorkday(day3) || isHoliday(day3)) { grayEnd = day3; grayStart = addDays(grayEnd, -1); day3 = addDays(grayEnd, 1); }
  const regressionEnd   = addWorkdays(grayStart, -1);
  const regressionStart = addWorkdays(regressionEnd, -1);
  const integrationEnd  = addWorkdays(regressionStart, -1);
  const testEnd         = addWorkdays(integrationEnd, -1);

  // 开发+测试
  const availWD = countWorkdays(devStart, testEnd);
  const poolWD = Math.max(3, availWD - 1);
  const devDays = Math.max(2, Math.round(poolWD * 2 / 3));
  const testDays = Math.max(1, poolWD - devDays);
  const devEnd    = addWorkdays(devStart, devDays - 1);
  const freezeDate = addWorkdays(devEnd, 1);
  const testStart = addWorkdays(freezeDate, 1);
  const devFreeze = new Date(freezeDate);

  const longHol = hasLongHoliday(devStart, launch);
  let blocked = hasLongHoliday(schedule, launch);
  if (!blocked) for (let d = new Date(schedule); d <= launch; d = addDays(d, 1)) { if (isNoReleaseDate(d)) { blocked = true; break; } }

  return { brdInit, brdFinal, prdInitInt, prdFinalInt, prdFinalOrder, prdFinalSearch, schedule,
    devStart, devEnd, devFreeze, testStart, testEnd, integrationEnd,
    regressionStart, regressionEnd, grayStart, grayEnd,
    androidReview, huaweiIosReview, launch,
    longHol, totalDevTest: devDays + testDays, isMonthly: blocked };
}

function buildVersions() {
  const versions = [];
  const pushVer = (v) => { const lm = v.launch.getMonth(); const cnt = versions.filter(x => x.launch.getMonth() === lm).length + 1; v.name = `S${lm + 1}-${cnt}`; versions.push(v); };

  // S7-1: BRD 6/4, 月中
  pushVer(buildOneVersion('2026-06-04', findTargetLaunch(6, 'mid')));  // S7-1
  // S7-2: BRD 6/18, BRD终评=6/23(周二), PRD初评=6/25(周四), iOS不变=7/31
  { const v = buildOneVersion('2026-06-18', findTargetLaunch(6, 'end'));
    const origLaunch = v.launch, origDevFreeze = v.devFreeze, origTest = v.totalDevTest;
    v.brdFinal = new Date('2026-06-23'); v.prdInitInt = new Date('2026-06-25');
    v.prdFinalOrder = nextMonday(v.prdInitInt); v.prdFinalSearch = addWorkdays(v.prdFinalOrder, 1);
    v.prdFinalInt = new Date(v.prdFinalSearch); v.schedule = addWorkdays(v.prdFinalSearch, 2);
    v.devStart = addWorkdays(v.schedule, 1);
    // 保持原 dev+test 池和 launch 不变，重算中间阶段
    const tgt = origLaunch; const hw = new Date(tgt); const aw = addWorkdays(hw, -1);
    const ge = addDays(aw, -1); let gs = addDays(ge, -1);
    let d3 = addDays(ge, 1); while (!isWorkday(d3) || isHoliday(d3)) { ge = d3; gs = addDays(ge, -1); d3 = addDays(ge, 1); }
    v.grayStart = gs; v.grayEnd = ge;
    const re = addWorkdays(gs, -1); const rs = addWorkdays(re, -1);
    v.regressionStart = rs; v.regressionEnd = re;
    const ie = addWorkdays(rs, -1); const te = addWorkdays(ie, -1);
    v.integrationEnd = ie; v.testEnd = te; v.androidReview = aw; v.huaweiIosReview = hw;
    const awd = countWorkdays(v.devStart, te); const pw = Math.max(3, awd - 1);
    const dd = Math.max(2, Math.round(pw*2/3)); const td = Math.max(1, pw-dd);
    v.devEnd = addWorkdays(v.devStart, dd-1); v.devFreeze = new Date(addWorkdays(v.devEnd, 1));
    v.testStart = addWorkdays(v.devFreeze, 1); v.totalDevTest = dd+td;
    v.name = 'S7-2'; versions.push(v);
  }

  // S8-1: BRD 7/2, 月中
  pushVer(buildOneVersion('2026-07-02', findTargetLaunch(7, 'mid')));  // S8-1
  // S8-2: BRD 7/16, 月末
  pushVer(buildOneVersion('2026-07-16', findTargetLaunch(7, 'end')));  // S8-2

  // S9-1: BRD 7/30, 月中
  pushVer(buildOneVersion('2026-07-30', findTargetLaunch(8, 'mid')));  // S9-1
  // S9-2: BRD 8/13, iOS 特殊 → 10/9
  { const v = buildOneVersion('2026-08-13', ensureWorkday(new Date('2026-10-09'))); v.name = 'S9-2'; versions.push(v); }

  // S10-1: BRD 8/27, 月末（单版月）
  { const v = buildOneVersion('2026-08-27', findTargetLaunch(9, 'end')); v.name = 'S10-1'; versions.push(v); }

  // S11-1: BRD 10/22（用户指定）, 月末
  pushVer(buildOneVersion('2026-10-22', findTargetLaunch(10, 'end')));  // S11-1

  // S12-1: BRD 11/5, 月中
  pushVer(buildOneVersion('2026-11-05', findTargetLaunch(11, 'mid')));  // S12-1
  // S12-2: BRD 11/19, 月末
  pushVer(buildOneVersion('2026-11-19', findTargetLaunch(11, 'end')));  // S12-2

  return versions;
}
let allVersions;
let eventMap = {};

// 版本颜色表（自动生成，每版一色）
const VERSION_HUES = {};
function getVerColor(ver) {
  if (!VERSION_HUES[ver]) {
    const idx = Object.keys(VERSION_HUES).length;
    VERSION_HUES[ver] = `hsl(${(idx * 47 + 200) % 360}, 70%, 88%)`; // 柔和背景色
  }
  return VERSION_HUES[ver];
}
function getVerTextColor(ver) {
  if (!VERSION_HUES[ver]) getVerColor(ver);
  const hue = parseInt(VERSION_HUES[ver].match(/\d+/)[0]);
  return `hsl(${hue}, 50%, 25%)`;
}

function addEvent(d, label, cls, ver) {
  const k = fmt(d);
  if (!eventMap[k]) eventMap[k] = [];
  eventMap[k].push({label, cls, ver, color: getVerColor(ver), textColor: getVerTextColor(ver)});
}

function buildEventMap() {
  eventMap = {};
  allVersions.forEach(v => {
    const n = v.name;
    // 前置流程（BRD → 输出排期）
    addEvent(v.brdInit,          `${n} BRD初评`,         'ev-brd-init',    n);
    addEvent(v.brdFinal,         `${n} BRD终评`,         'ev-brd-final',   n);
    addEvent(v.prdInitInt,       `${n} 内部PRD初评`,      'ev-prd-init',    n);
    addEvent(v.prdFinalInt,      `${n} 内部PRD终评`,      'ev-prd-final',   n);
    addEvent(v.prdFinalOrder,    `${n} PRD终评(订单)`,    'ev-prd-order',   n);
    addEvent(v.prdFinalSearch,   `${n} PRD终评(搜推)`,    'ev-prd-search',  n);
    addEvent(v.schedule,         `${n} 输出排期`,         'ev-schedule',    n);

    // 开发 + 测试
    let cur = new Date(v.devStart);
    while (cur <= v.devEnd) {
      if (isWorkday(cur)) addEvent(cur, `${n} 开发`, 'ev-dev', n);
      cur = addDays(cur, 1);
    }
    addEvent(v.devFreeze, `${n} 需求开发完成&提测截止&视觉验证`, 'ev-dev', n);
    cur = new Date(v.testStart);
    while (cur <= v.testEnd) {
      if (isWorkday(cur)) addEvent(cur, `${n} 测试`, 'ev-test', n);
      cur = addDays(cur, 1);
    }

    // 集成 → 发版
    addEvent(v.integrationEnd,   `${n} 集成/上线`,        'ev-schedule',    n);
    addEvent(v.regressionStart,  `${n} 客户端回归`,        'ev-regression',  n);
    addEvent(v.regressionEnd,    `${n} 客户端回归`,        'ev-regression',  n);
    addEvent(v.grayStart,        `${n} 灰度`,             'ev-gray',        n);
    addEvent(v.grayEnd,          `${n} 灰度`,             'ev-gray',        n);
    addEvent(v.androidReview,    `${n} 安卓/鸿蒙提审`,     'ev-android',     n);
    addEvent(v.huaweiIosReview,  `${n} iOS提审/发版`,      'ev-launch',      n);
  });
}

// ----- 从服务器加载数据 -----
async function loadFromServer() {
  try {
    const [vRes, hRes, nrRes] = await Promise.all([
      fetch(API + '/api/versions'),
      fetch(API + '/api/holidays'),
      fetch(API + '/api/no-release'),
    ]);
    const versions = await vRes.json();
    // 取第一个版本的 brdDate 作为起始日期
    if (versions.length > 0) {
      startBrdDate = versions[0].brdDate;
    }

    const holidays = await hRes.json();
    userHolidays = holidays.filter(h => h.type === 'holiday').map(h => ({ id: h.id, start: h.start, end: h.end }));
    userMakeupDays = holidays.filter(h => h.type === 'makeup').map(h => ({ id: h.id, start: h.start, end: h.end }));

    const noRel = await nrRes.json();
    noReleaseRanges = noRel.map(n => ({ id: n.id, start: n.start, end: n.end }));
  } catch (e) {
    console.warn('服务器不可用，使用默认数据', e.message);
    // 使用默认数据作为降级
    userHolidays = [];
    userMakeupDays = [];
    noReleaseRanges = [];
  }
}

function renderCal() {
  const grid = document.getElementById('calGrid');
  const monthTitle = document.getElementById('monthTitle');

  const year = currentYear;
  const month = currentMonth;
  const title = `${year}年${month+1}月`;
  monthTitle.textContent = title;

  // Sync dropdowns
  const ys = document.getElementById('yearSelect');
  const ms = document.getElementById('monthSelect');
  if (ys) ys.value = String(year);
  if (ms) ms.value = String(month);

  grid.innerHTML = '';

  ['日','一','二','三','四','五','六'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-header';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startDow = firstDay.getDay();
  const today = new Date();

  for (let i = 0; i < startDow; i++) {
    const d = new Date(year, month, 1 - (startDow - i));
    const cell = makeCell(d, true, today);
    grid.appendChild(cell);
  }

  for (let d = 1; d <= lastDay.getDate(); d++) {
    const date = new Date(year, month, d);
    const cell = makeCell(date, false, today);
    grid.appendChild(cell);
  }

  const total = startDow + lastDay.getDate();
  const rem = (7 - (total % 7)) % 7;
  for (let i = 1; i <= rem; i++) {
    const date = new Date(year, month+1, i);
    const cell = makeCell(date, true, today);
    grid.appendChild(cell);
  }
}

function makeCell(date, otherMonth, today) {
  const cell = document.createElement('div');
  cell.className = 'cal-day';

  const isHol = isHoliday(date);
  const isMkup = isMakeup(date);
  const isWknd = isWeekend(date);

  if (otherMonth) cell.classList.add('other-month');
  else if (isHol) cell.classList.add('holiday');
  else if (isWknd && !isMkup) cell.classList.add('weekend');

  if (fmt(date) === fmt(today)) cell.classList.add('today');

  // 日期数字
  const numDiv = document.createElement('div');
  numDiv.className = 'day-num' + (isHol ? ' holiday-num' : '');
  if (isHol) numDiv.innerHTML = date.getDate() + ' <span class="day-badge hol">休</span>';
  else if (isMkup) numDiv.innerHTML = date.getDate() + ' <span class="day-badge wrk">班</span>';
  else numDiv.textContent = date.getDate();
  cell.appendChild(numDiv);

  // 获取当日事件
  const evs = eventMap[fmt(date)] || [];
  const filteredEvs = selectedVersion
    ? evs.filter(e => e.ver === selectedVersion)
    : evs;

  // 去重
  const seen = new Set();
  const uniqueEvs = [];
  filteredEvs.forEach(e => {
    const key = e.label + e.cls;
    if (!seen.has(key)) { seen.add(key); uniqueEvs.push(e); }
  });

  // 平铺排放，最多4条
  uniqueEvs.slice(0, 4).forEach(ev => {
    const el = document.createElement('div');
    el.className = 'event';
    el.style.cssText = `background:${ev.color || 'var(--color-surface-alt)'};color:${ev.textColor || 'var(--color-text-secondary)'};font-weight:500;`;
    el.textContent = ev.label;
    el.title = ev.label;
    cell.appendChild(el);
  });
  if (uniqueEvs.length > 4) {
    const more = document.createElement('div');
    more.className = 'event';
    more.style.cssText = 'background:var(--color-surface-alt);color:var(--color-text-secondary);font-weight:600;';
    more.textContent = `+${uniqueEvs.length - 4} 更多`;
    cell.appendChild(more);
  }

  return cell;
}

function prevMonth() {
  if (currentMonth > 0) { currentMonth--; renderCal(); }
}

function nextMonth() {
  if (currentMonth < 11) { currentMonth++; renderCal(); }
}

function prevYear() {
  if (currentYear > 2020) { currentYear--; renderCal(); }
}

function nextYear() {
  if (currentYear < 2030) { currentYear++; renderCal(); }
}

function jumpToVersion() {

  const v = allVersions.find(x => x.name === name);

  }

  renderCal();
}

// Agent 冲突检测：返回结构化冲突列表
function detectConflicts() {
  const conflicts = [];
  const monthCount = {};
  // 1. 同月版本数检查
  for (const v of allVersions) {
    const m = v.launch.getMonth();
    monthCount[m] = (monthCount[m] || 0) + 1;
  }
  for (const m in monthCount) {
    const limit = SINGLE_VERSION_MONTHS.has(Number(m)) ? 1 : 2;
    if (monthCount[m] > limit) {
      conflicts.push({ type: '同月超版数', detail: `${Number(m)+1}月有 ${monthCount[m]} 版，上限 ${limit}` });
    }
  }
  // 2. 开发/测试同天重叠
  for (let i = 0; i < allVersions.length; i++) {
    for (let j = i+1; j < allVersions.length; j++) {
      const a = allVersions[i], b = allVersions[j];
      const devDup = !(a.devEnd < b.devStart || a.devStart > b.devEnd);
      const testDup = !(a.testEnd < b.testStart || a.testStart > b.testEnd);
      if (devDup) conflicts.push({ type: '开发重叠', detail: `${a.name} 与 ${b.name} 开发日期重叠` });
      if (testDup) conflicts.push({ type: '测试重叠', detail: `${a.name} 与 ${b.name} 测试日期重叠` });
    }
  }
  // 3. iOS 在禁发日
  for (const v of allVersions) {
    if (isNoReleaseDate(v.launch)) conflicts.push({ type: '禁发日冲突', detail: `${v.name} 发版日 ${fmt(v.launch)} 是禁发日期` });
  }
  return conflicts;
}

// 环节名 → 版本对象字段 映射
const PHASE_MAP = {
  'brdFinal': 'brdFinal', 'prdInit': 'prdInitInt',
  'prdFinalOrder': 'prdFinalOrder', 'prdFinalSearch': 'prdFinalSearch',
  'schedule': 'schedule', 'devStart': 'devStart', 'devEnd': 'devEnd',
  'devFreeze': 'devFreeze', 'testStart': 'testStart', 'testEnd': 'testEnd',
  'integration': 'integrationEnd', 'regressionStart': 'regressionStart',
  'grayStart': 'grayStart', 'android': 'androidReview', 'launch': 'launch',
};

// 正常排期：给定版本名 + 开始/结束日期，生成一个完整版本并替换/插入
function generateScheduleVersion(version, startDate, endDate) {
  const v = buildOneVersion(startDate, new Date(endDate + 'T00:00:00'));
  v.name = version;
  const idx = allVersions.findIndex(x => x.name === version);
  if (idx >= 0) allVersions[idx] = v; else allVersions.push(v);
  return v;
}

// 修改调整：锁定 BRD初评 + iOS发版，只改指定环节日期，重算下游
function adjustScheduleVersion(version, phase, date) {
  const v = allVersions.find(x => x.name === version);
  if (!v) return null;
  const field = PHASE_MAP[phase];
  if (!field) return null;

  const lockedBrd = v.brdInit;        // 锚点1：BRD初评不变
  const lockedLaunch = v.launch;      // 锚点2：iOS发版不变

  // 用锁定锚点重新生成标准版本
  const rebuilt = buildOneVersion(fmt(lockedBrd), lockedLaunch);
  rebuilt.name = version;

  // 将用户指定的环节覆盖为新日期
  rebuilt[field] = new Date(date + 'T00:00:00');

  // 前置链条正向重算（brdFinal → devStart）
  if (['brdFinal','prdInitInt','prdFinalOrder','prdFinalSearch','schedule','devStart'].includes(field)) {
    if (field === 'brdFinal' || field === 'prdInitInt') {
      rebuilt.prdFinalOrder = nextMonday(rebuilt.prdInitInt);
      rebuilt.prdFinalSearch = addWorkdays(rebuilt.prdFinalOrder, 1);
      rebuilt.prdFinalInt = new Date(rebuilt.prdFinalSearch);
    }
    if (field !== 'schedule' && field !== 'devStart') {
      rebuilt.schedule = addWorkdays(rebuilt.prdFinalSearch, 2);
      rebuilt.devStart = addWorkdays(rebuilt.schedule, 1);
    } else if (field === 'schedule') {
      rebuilt.devStart = addWorkdays(rebuilt.schedule, 1);
    }
    // 从 devStart 到 launch 重算 dev+test
    const te = addWorkdays(rebuilt.launch, -3); // 粗略倒推测试结束
    const awd = countWorkdays(rebuilt.devStart, te);
    const pw = Math.max(3, awd - 1);
    const dd = Math.max(2, Math.round(pw*2/3));
    const td = Math.max(1, pw-dd);
    rebuilt.devEnd = addWorkdays(rebuilt.devStart, dd-1);
    rebuilt.devFreeze = new Date(addWorkdays(rebuilt.devEnd, 1));
    rebuilt.testStart = addWorkdays(rebuilt.devFreeze, 1);
    rebuilt.testEnd = addWorkdays(rebuilt.testStart, td-1);
    rebuilt.totalDevTest = dd+td;
  }

  const idx = allVersions.findIndex(x => x.name === version);
  if (idx >= 0) allVersions[idx] = rebuilt; else allVersions.push(rebuilt);
  return rebuilt;
}

      return `<div class="chat-msg tool">${delBtn}<details><summary>工具: ${m.label || '执行操作'}</summary><div class="tool-detail">${m.content}</div></details></div>`;
    }
    const cls = m.role === 'user' ? 'user' : 'assistant';
    return `<div class="chat-msg ${cls}">${delBtn}<span>${m.content.replace(/\n/g, '<br>')}</span></div>`;
  }).join('');
  el.scrollTop = el.scrollHeight;
}

function buildSystemPrompt() {
  const scheduleSummary = allVersions.map(v =>
    `${v.name}: BRD初评${fmtCN(v.brdInit)} → 开发${fmtCN(v.devStart)}~${fmtCN(v.devEnd)} → 测试${fmtCN(v.testStart)}~${fmtCN(v.testEnd)} → 发版${fmtCN(v.launch)}${v.longHol?' [含长假]':''}`
  ).join('\n');

  const holidaySummary = userHolidays.map(r => `${r.start}~${r.end}`).join(', ') || '无';
  const makeupSummary = userMakeupDays.map(r => `${r.start}~${r.end}`).join(', ') || '无';

  const prefSummary = Object.keys(preferences).length ? '\n## 用户长期偏好\n' + Object.entries(preferences).map(([k,v]) => `- ${k}: ${v}`).join('\n') : '';

  return `你是"1号会员店"2026年发版日历的AI排期 Agent。你不仅回答，还要像专业排期专家一样主动完成任务。

## 你的工作方式（推理框架）
遇到排期任务时，遵循「规划→执行→评估」循环：
1. 规划：先把任务拆成明确步骤（读取现状 → 计算/修改 → 检查冲突 → 汇报）
2. 执行：按步骤调用函数，每步拿到结果再决定下一步
3. 评估：修改后主动调用 detect_conflicts 检查是否有冲突，有冲突则调整；无冲突则汇报结果

## 当前排期（共${allVersions.length}个版本）
${scheduleSummary}

## 用户自定义假期
${holidaySummary}

## 用户自定义调休工作日
${makeupSummary}
${prefSummary}

## 排期规则
- 开发+测试长度根据BRD初评和发版日之间的可用工作日动态计算，按2:1分配
- 半月版（默认）：上一版输出排期当天 = 下一版BRD初评
- 同一自然月最多发版2次，超出自动顺延至下月首个工作日
- 所有排期仅计算工作日（周末和节假日自动跳过）
- 正向紧密链条：…→开发(2:1)→提测(1wd)→测试→集成(1wd)→回归(2工作日，往后放)→灰度(2自然日，周末照常)→安卓(1wd)→iOS(1wd)=发版
- 下一版 BRD初评 = 上一版「需求开发完成&提测截止&视觉验证」当天
- 同一月的第二版发版日必须在当月内
- 上线时间只能在节假日后，禁止发版日期不可上线

## 可用函数
- add_holiday / remove_holiday — 添加/删除假期区间
- add_makeup_day / remove_makeup_day — 添加/删除调休工作日
- list_holidays — 列出所有自定义假期
- get_schedule — 查看版本排期详情
- set_start_date — 修改首版BRD初评日期，自动重新生成所有版本
- detect_conflicts — 检测排期冲突（改完排期后应主动调用）
- analyze_holiday — 分析假期对排期的影响
- get_preference / set_preference — 读取/保存用户长期偏好（用户提到的排期偏好应主动记住）

用中文回复，简洁清晰。主动完成任务，主动检查冲突，主动记住用户偏好。`;
}

async function executeTool(name, input) {
  switch (name) {
    case 'add_holiday':
      userHolidays.push({start: input.start, end: input.end});
      rebuildAll();
      renderHolidayList();
      return `已添加假期：${input.start} → ${input.end}`;
    case 'remove_holiday':
      if (input.index >= 0 && input.index < userHolidays.length) {
        const r = userHolidays.splice(input.index, 1)[0];
        rebuildAll();
        renderHolidayList();
        return `已删除假期：${r.start} → ${r.end}`;
      }
      return `删除失败：索引 ${input.index} 超出范围（当前共 ${userHolidays.length} 条假期）`;
    case 'add_makeup_day':
      userMakeupDays.push({start: input.start, end: input.end});
      rebuildAll();
      renderHolidayList();
      return `已添加调休日：${input.start} → ${input.end}`;
    case 'remove_makeup_day':
      if (input.index >= 0 && input.index < userMakeupDays.length) {
        const r = userMakeupDays.splice(input.index, 1)[0];
        rebuildAll();
        renderHolidayList();
        return `已删除调休日：${r.start} → ${r.end}`;
      }
      return `删除失败：索引 ${input.index} 超出范围（当前共 ${userMakeupDays.length} 条调休日）`;
    case 'list_holidays':
      const h = userHolidays.map((r,i) => `${i}: ${r.start}→${r.end}`).join(', ') || '无';
      const m = userMakeupDays.map((r,i) => `${i}: ${r.start}→${r.end}`).join(', ') || '无';
      return `自定义假期: [${h}]\n调休工作日: [${m}]`;
    case 'get_schedule':
      if (input.version) {
        const v = allVersions.find(x => x.name === input.version);
        if (!v) return `未找到版本 ${input.version}`;
        return `${v.name}: BRD初评${fmtCN(v.brdInit)} → BRD终评${fmtCN(v.brdFinal)} → PRD初评${fmtCN(v.prdInitInt)} → PRD终评${fmtCN(v.prdFinalInt)} → PRD终评(订单)${fmtCN(v.prdFinalOrder)} → PRD终评(搜推)${fmtCN(v.prdFinalSearch)} → 输出排期${fmtCN(v.schedule)} → 开发${fmtCN(v.devStart)}~${fmtCN(v.devEnd)}(${Math.round(v.totalDevTest*2/3)}天) → 测试${fmtCN(v.testStart)}~${fmtCN(v.testEnd)}(${v.totalDevTest-Math.round(v.totalDevTest*2/3)}天) → 客户端回归${fmtCN(v.regressionStart)}~${fmtCN(v.regressionEnd)} → 灰度${fmtCN(v.grayStart)}~${fmtCN(v.grayEnd)} → 提审${fmtCN(v.androidReview)} → 发版${fmtCN(v.launch)}${v.longHol?' [含长假]':''}`;
      }
      return allVersions.map(v => `${v.name}: 发版${fmtCN(v.launch)}`).join('\n');
    case 'set_start_date': {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(input.date)) return '日期格式错误，请使用 YYYY-MM-DD';
      startBrdDate = input.date;
      rebuildAll();
      return `起始BRD初评日期已修改为 ${input.date}，版本已自动重新生成（${allVersions.map(v=>v.name).join(', ')}）`;
    }
    case 'detect_conflicts': {
      const conflicts = detectConflicts();
      if (conflicts.length === 0) return '✅ 当前排期无冲突';
      return `发现 ${conflicts.length} 个冲突：\n` + conflicts.map(c => `- [${c.type}] ${c.detail}`).join('\n');
    }
    case 'analyze_holiday': {
      const s = new Date(input.start + 'T00:00:00');
      const e = new Date(input.end + 'T00:00:00');
      const affected = [];
      for (const v of allVersions) {
        const overlap = !(v.launch < s || v.brdInit > e);
        if (overlap) affected.push(`${v.name}（BRD初评${fmtCN(v.brdInit)}，发版${fmtCN(v.launch)}）`);
      }
      const long = hasLongHoliday(s, e) || (Math.round((e - s) / 86400000) + 1) >= 4;
      const note = long ? '该假期≥4天，会触发排期顺延' : '该假期<4天，不影响排期节奏';
      if (affected.length === 0) return `该假期(${input.start}~${input.end})不影响任何版本。${note}`;
      return `假期 ${input.start}~${input.end} 影响以下版本：\n` + affected.join('\n') + `\n${note}`;
    }
    case 'get_preference': {
      if (input.key) return preferences[input.key] !== undefined ? preferences[input.key] : `(未设置 ${input.key})`;
      const keys = Object.keys(preferences);
      if (keys.length === 0) return '暂无保存的偏好';
      return keys.map(k => `${k}: ${preferences[k]}`).join('\n');
    }
    case 'set_preference': {
      preferences[input.key] = input.value;
      await fetch(API + '/api/preferences', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ key: input.key, value: input.value }),
      }).catch(() => {});
      return `已记住偏好：${input.key} = ${input.value}`;
    }
    case 'generate_schedule': {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(input.startDate) || !/^\d{4}-\d{2}-\d{2}$/.test(input.endDate)) {
        return '日期格式错误，请使用 YYYY-MM-DD';
      }
      const v = generateScheduleVersion(input.version, input.startDate, input.endDate);
      buildEventMap();
      renderTabs(); renderCal(); renderDetail();
      return `${input.version} 排期已生成：BRD初评 ${fmtCN(v.brdInit)} → iOS发版 ${fmtCN(v.launch)}，共 ${v.totalDevTest} 个开发+测试工作日`;
    }
    case 'adjust_schedule': {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(input.date)) return '日期格式错误，请使用 YYYY-MM-DD';
      const v = adjustScheduleVersion(input.version, input.phase, input.date);
      if (!v) return `调整失败：版本 ${input.version} 不存在或环节 ${input.phase} 无效。可用环节：${Object.keys(PHASE_MAP).join(', ')}`;
      buildEventMap();
      renderTabs(); renderCal(); renderDetail();
      const field = PHASE_MAP[input.phase];
      return `${input.version} 的「${input.phase}」已调整为 ${input.date}（BRD初评 ${fmtCN(v.brdInit)} 和 iOS发版 ${fmtCN(v.launch)} 保持不变）`;
    }
    default:
      return `未知工具: ${name}`;
  }
}

async function sendChat() {
  if (chatBusy) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  switchRightTab('chat');
  addChatMsg('user', text);
  input.value = '';
  chatBusy = true;
  document.getElementById('chatSendBtn').disabled = true;
  document.getElementById('chatStatus').className = 'chat-status online';

  const sysPrompt = buildSystemPrompt();
  const apiMessages = [
    {role: 'system', content: sysPrompt}
  ];
  for (let i = 1; i < chatMessages.length; i++) {
    const m = chatMessages[i];
    if (m.role === 'user') {
      apiMessages.push({role: 'user', content: m.content});
    } else if (m.role === 'assistant') {
      if (m.toolCalls) {
        apiMessages.push({role: 'assistant', content: m.content || null, tool_calls: m.toolCalls});
      } else {
        apiMessages.push({role: 'assistant', content: m.content});
      }
    } else if (m.role === 'tool') {
      // 只回放有 toolCallId 的结果消息，跳过纯展示的"调用"消息
      if (m.toolCallId) {
        apiMessages.push({role: 'tool', tool_call_id: m.toolCallId, content: m.content});
      }
    }
  }

  let maxRounds = 5;
  while (maxRounds-- > 0) {
    try {
      const model = document.getElementById('chatModel').value;

      const resp = await fetch(API + '/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          model: model,
          max_tokens: 4096,
          messages: apiMessages,
          tools: TOOLS,
          stream: false,
        }),
      });

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        const errMsg = typeof err.error === 'string' ? err.error : JSON.stringify(err.error || err);
        addChatMsg('assistant', '❌ API 错误: ' + (errMsg || resp.statusText));
        break;
      }

      const data = await resp.json();
      const choice = (data.choices || [])[0];
      if (!choice) { addChatMsg('assistant', '(空响应，请重试)'); break; }

      const msg = choice.message;
      const textContent = msg.content || '';
      const toolCalls = msg.tool_calls || [];

      if (toolCalls.length > 0) {
        const msg = {role: 'assistant', content: textContent, toolCalls: toolCalls};
        chatMessages.push(msg);
        renderChatMessages();
        saveChatMessage('assistant', textContent, toolCalls);

        for (const tc of toolCalls) {
          const fn = tc.function;
          let args = {};
          try { args = JSON.parse(fn.arguments || '{}'); } catch(e) {}
          const result = await executeTool(fn.name, args);
          // 单条 tool 消息，含调用参数和结果，带 toolCallId 用于 API 回放
          addChatMsg('tool', `📥 ${JSON.stringify(args)}\n📤 ${result}`, `${fn.name}`);
          // 立即补上 toolCallId
          chatMessages[chatMessages.length - 1].toolCallId = tc.id;

          apiMessages.push({role: 'assistant', content: textContent || null, tool_calls: [tc]});
          apiMessages.push({role: 'tool', tool_call_id: tc.id, content: result});
        }
        continue;
      } else {
        const msg = {role: 'assistant', content: textContent};
        chatMessages.push(msg);
        renderChatMessages();
        saveChatMessage('assistant', textContent);
        break;
      }
    } catch(e) {
    addChatMsg('assistant', '❌ 连接失败: ' + e.message + '\n请确认 Vercel 环境变量和 API 路由已配置正确');
      document.getElementById('chatStatus').className = 'chat-status offline';
      break;
    }
  }

  if (maxRounds <= 0) {
    addChatMsg('assistant', '(已达到最大工具调用轮次，请重新提问)');
  }

  chatBusy = false;
  document.getElementById('chatSendBtn').disabled = false;
}

function exportImage(verName) {
  const v = verName || selectedVersion;
  if (!v) { alert('请先在版本 Tabs 中选择一个版本，再导出图片'); return; }
  const ver = allVersions.find(x => x.name === v);
  if (!ver) return;

  const styles = Array.from(document.querySelectorAll('style')).map(s => s.outerHTML).join('\n');
  const today = new Date();

  // 版本从 BRD初评 到 发版，跨月完整展示
  const startM = ver.brdInit.getMonth();
  const endM = ver.launch.getMonth();
  const year = ver.brdInit.getFullYear();

  let monthsHtml = '';
  for (let m = startM; m <= endM; m++) {
    monthsHtml += `<h4 style="text-align:center;margin:20px 0 8px">${year}年${m+1}月</h4>`;
    monthsHtml += '<div class="calendar-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:#fff;border-radius:10px;border:1px solid #E2E8F0;padding:8px;box-shadow:0 1px 2px rgba(15,23,42,.04);">';
    monthsHtml += ['日','一','二','三','四','五','六'].map(d => `<div class="cal-header" style="text-align:center;font-size:11px;font-weight:600;color:#64748B;padding:8px 4px">${d}</div>`).join('');

    const firstDay = new Date(year, m, 1);
    const lastDay = new Date(year, m+1, 0);
    const startDow = firstDay.getDay();
    // 前填充
    for (let i = 0; i < startDow; i++) {
      const d = new Date(year, m, 1 - (startDow - i));
      monthsHtml += buildExportCellHTML(d, true, today, v);
    }
    // 当月
    for (let d = 1; d <= lastDay.getDate(); d++) {
      monthsHtml += buildExportCellHTML(new Date(year, m, d), false, today, v);
    }
    // 后填充
    const total = startDow + lastDay.getDate();
    const rem = (7 - (total % 7)) % 7;
    for (let i = 1; i <= rem; i++) {
      monthsHtml += buildExportCellHTML(new Date(year, m+1, i), true, today, v);
    }
    monthsHtml += '</div>';
  }

  const w = window.open('', '_blank', 'width=1400,height=1000');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${v}</title>${styles}
<style>.event{white-space:normal!important;overflow:visible!important;text-overflow:unset!important;word-break:break-all;font-size:11px!important}.cal-day{min-height:auto!important;height:auto!important;padding:4px!important}.cal-day.other-month{opacity:0.25!important}</style>
</head><body style="background:#fff;padding:20px;font-family:'PingFang SC','Microsoft YaHei',sans-serif;"><h3 style="text-align:center;margin-bottom:4px">1号会员店发版日历 — ${v}</h3>${monthsHtml}</body></html>`);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 800);
}

  let monthsHtml = '';
  for (let m = startM; m <= endM; m++) {
    monthsHtml += `<h3 style="text-align:center;margin:16px 0 8px;page-break-before:${m>startM?'always':'auto'}">1号会员店发版日历 — ${year}年${m+1}月</h3>`;
    monthsHtml += '<div class="calendar-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;background:#fff;border-radius:10px;border:1px solid #E2E8F0;padding:8px">';
    monthsHtml += ['日','一','二','三','四','五','六'].map(d => `<div class="cal-header" style="text-align:center;font-size:12px;font-weight:600;color:#64748B;padding:8px">${d}</div>`).join('');

    const firstDay = new Date(year, m, 1);
    const lastDay = new Date(year, m+1, 0);
    const startDow = firstDay.getDay();
    for (let i = 0; i < startDow; i++) {
      monthsHtml += buildExportCellHTML(new Date(year, m, 1 - (startDow - i)), true, today, null);
    }
    for (let d = 1; d <= lastDay.getDate(); d++) {
      monthsHtml += buildExportCellHTML(new Date(year, m, d), false, today, null);
    }
    const total = startDow + lastDay.getDate();
    const rem = (7 - (total % 7)) % 7;
    for (let i = 1; i <= rem; i++) {
      monthsHtml += buildExportCellHTML(new Date(year, m+1, i), true, today, null);
    }
    monthsHtml += '</div>';
  }

  const w = window.open('', '_blank', 'width=1400,height=1000');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>发版日历全部版本</title>${styles}
<style>.event{white-space:normal!important;overflow:visible!important;text-overflow:unset!important;word-break:break-all;font-size:11px!important}.cal-day{min-height:auto!important;height:auto!important;padding:4px!important}.cal-day.other-month{opacity:0.25!important}@media print{.cal-day{border:0.5px solid #E2E8F0!important}}</style>
</head><body style="background:#fff;padding:20px;font-family:'PingFang SC','Microsoft YaHei',sans-serif;">${monthsHtml}</body></html>`);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 800);
}

function buildExportCellHTML(date, otherMonth, today, verName) {
  const cls = ['cal-day'];
  if (otherMonth) cls.push('other-month');
  else if (isHoliday(date)) cls.push('holiday');
  else if (isWeekend(date) && !isMakeup(date)) cls.push('weekend');
  if (fmt(date) === fmt(today)) cls.push('today');

  let inner = `<div class="day-num${isHoliday(date)?' holiday-num':''}" style="font-size:11px;font-weight:500;color:#64748B;margin-bottom:3px">${date.getDate()}</div>`;
  const evs = verName ? (eventMap[fmt(date)] || []).filter(e => e.ver === verName) : (eventMap[fmt(date)] || []);
  const seen = new Set();
  evs.forEach(e => {
    const key = e.label + e.ver;
    if (seen.has(key)) return; seen.add(key);
    const bg = e.color || '#E2E8F0';
    const tc = e.textColor || '#374151';
    inner += `<div style="background:${bg};color:${tc};font-size:11px;font-weight:500;padding:2px 5px;border-radius:3px;margin-bottom:2px;line-height:1.5;white-space:normal;word-break:break-all">${e.label}</div>`;
  });
  return `<div class="${cls.join(' ')}" style="min-height:auto;height:auto;border-radius:6px;border:1px solid transparent;padding:4px;background:#fff;display:flex;flex-direction:column">${inner}</div>`;
}

// ===== 导出 xlsx 日历格式 =====
function exportExcel() {
  if (allVersions.length === 0 || typeof XLSX === 'undefined') { alert('XLSX库加载中，请稍后再试'); return; }
  const year = allVersions[0].brdInit.getFullYear();
  const startM = allVersions[0].brdInit.getMonth();
  const endM = allVersions[allVersions.length - 1].launch.getMonth();
  const wb = XLSX.utils.book_new();

  for (let m = startM; m <= endM; m++) {
    const firstDay = new Date(year, m, 1);
    const lastDay = new Date(year, m+1, 0);
    const startDow = firstDay.getDay();
    const totalDays = lastDay.getDate();
    const weeks = Math.ceil((startDow + totalDays) / 7);

    // 标题行 + 表头 + 数据行
    const aoa = [];
    aoa.push([{v: `1号会员店发版日历 — ${year}年${m+1}月`, t:'s'}]);
    aoa.push(['日','一','二','三','四','五','六']);

    for (let w = 0; w < weeks; w++) {
      const row = [];
      for (let c = 0; c < 7; c++) {
        const dayNum = w * 7 + c - startDow + 1;
        if (dayNum < 1 || dayNum > totalDays) { row.push(''); continue; }
        const date = new Date(year, m, dayNum);
        const evs = (eventMap[fmt(date)] || []);
        const seen = new Set();
        let cellText = `${dayNum}`;
        evs.forEach(e => {
          const k = e.label + e.ver;
          if (seen.has(k)) return; seen.add(k);
          cellText += '\n' + e.label;
        });
        row.push(cellText);
      }
      aoa.push(row);
    }

    const ws = XLSX.utils.aoa_to_sheet(aoa);

    // 合并标题行
    ws['!merges'] = [{s:{r:0,c:0}, e:{r:0,c:6}}];
    // 标题样式
    ws.A1 = {v: ws.A1.v, t:'s', s:{font:{bold:true,sz:14,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'2563EB'}},alignment:{horizontal:'center',vertical:'center'}}};
    // 表头样式
    for (let c = 0; c < 7; c++) {
      const addr = XLSX.utils.encode_cell({r:1,c});
      ws[addr].s = {font:{bold:true,sz:11},fill:{fgColor:{rgb:'E2E8F0'}},alignment:{horizontal:'center'}};
    }
    // 数据行样式（换行+顶对齐）
    for (let r = 2; r < aoa.length; r++) {
      for (let c = 0; c < 7; c++) {
        const addr = XLSX.utils.encode_cell({r,c});
        if (ws[addr] && ws[addr].v) {
          ws[addr].s = {alignment:{wrapText:true,vertical:'top'},font:{sz:10}};
        }
      }
    }
    ws['!cols'] = Array(7).fill({wch: 26});
    ws['!rows'] = [{hpx: 30}, {hpx: 22}];
    for (let r = 2; r < aoa.length; r++) ws['!rows'][r] = {hpx: 85};

    XLSX.utils.book_append_sheet(wb, ws, `${m+1}月`);
  }

  XLSX.writeFile(wb, `发版日历_${year}.xlsx`);
}

// ===== 导出 CSV =====
function exportCSV() {
  const rows = [['版本','BRD初评','BRD终评','内部PRD初评','内部PRD终评','PRD终评(订单)','PRD终评(搜推)','输出排期','开发开始','开发结束','需求开发完成&提测截止&视觉验证','测试开始','测试结束','集成/上线','回归开始','回归结束','灰度开始','灰度结束','安卓/鸿蒙提审','iOS提审/发版','节奏']];
  for (const v of allVersions) {
    rows.push([v.name, fmt(v.brdInit), fmt(v.brdFinal), fmt(v.prdInitInt), fmt(v.prdFinalInt), fmt(v.prdFinalOrder), fmt(v.prdFinalSearch), fmt(v.schedule), fmt(v.devStart), fmt(v.devEnd), fmt(v.devFreeze), fmt(v.testStart), fmt(v.testEnd), fmt(v.integrationEnd), fmt(v.regressionStart), fmt(v.regressionEnd), fmt(v.grayStart), fmt(v.grayEnd), fmt(v.androidReview), fmt(v.huaweiIosReview), v.isMonthly ? '月度' : '半月']);
  }
  const csv = '﻿' + rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `发版日历_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ===== 邮件提醒 =====
async function loadEmailConfig() {
  try {
    const r = await fetch('/api/email-config');
    const cfg = await r.json();
    document.getElementById('cfgSmtpHost').value = cfg.smtpHost || '';
    document.getElementById('cfgSmtpPort').value = cfg.smtpPort || 465;
    document.getElementById('cfgSmtpUser').value = cfg.smtpUser || '';
    document.getElementById('cfgSmtpPass').value = cfg.smtpPass || '';
    document.getElementById('cfgRecipients').value = cfg.recipients || '';
  } catch(e) {}
}

async function saveEmailConfig() {
  const body = {
    smtpHost: document.getElementById('cfgSmtpHost').value,
    smtpPort: parseInt(document.getElementById('cfgSmtpPort').value) || 465,
    smtpUser: document.getElementById('cfgSmtpUser').value,
    smtpPass: document.getElementById('cfgSmtpPass').value,
    recipients: document.getElementById('cfgRecipients').value,
  };
  await fetch('/api/email-config', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  alert('邮件配置已保存');
}

async function sendReminder() {
  const r = await fetch('/api/send-reminder', { method:'POST' });
  if (r.ok) alert('提醒已发送！请检查邮箱');
  else alert('发送失败，请检查 SMTP 配置');
}

(async function init() {
  await loadFromServer();
  loadEmailConfig();
  await loadPreferences();
  await loadConversations();
  renderPersonEditor();
  allVersions = buildVersions();
  buildEventMap();
  renderTabs();
  renderCal();
  renderDetail();
  renderRules();
})();
</script>
